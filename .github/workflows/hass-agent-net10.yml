name: V1k70rk4 HASS.Agent .NET10

on:
  push:
    tags:
      - "v*"
    paths:
      - "src/HASS.Agent.NET10/**"
      - "installer/**"
      - "NuGet.config"
      - ".github/workflows/hass-agent-net10.yml"
      - "README.md"
  pull_request:
    paths:
      - "src/HASS.Agent.NET10/**"
      - "installer/**"
      - "NuGet.config"
      - ".github/workflows/hass-agent-net10.yml"
      - "README.md"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: NuGet vulnerability audit
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/HASS.Agent.sln
      - name: Audit (fail on vulnerable packages)
        shell: bash
        run: |
          dotnet list src/HASS.Agent.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q 'has the following vulnerable' audit.txt; then
            echo "::error::Vulnerable NuGet packages found (see log above)"; exit 1
          fi
          echo "No vulnerable NuGet packages."

  build:
    name: Build and publish
    needs: audit
    runs-on: windows-latest

    env:
      PROJECT: src/HASS.Agent.NET10/HASS.Agent.NET10.csproj
      CONFIGURATION: Release
      RUNTIME: win-x64
      PUBLISH_DIR: artifacts/HASS.Agent.NET10/win-x64
      INSTALLER_DIR: artifacts/installer
      PACKAGE_DIR: artifacts/package

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $env:PROJECT

      - name: Build
        run: dotnet build $env:PROJECT -c $env:CONFIGURATION --no-restore

      - name: Read app version
        run: |
          [xml]$project = Get-Content $env:PROJECT
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Project version not found."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish self-contained win-x64
        run: >
          dotnet publish $env:PROJECT
          -c $env:CONFIGURATION
          -r $env:RUNTIME
          --self-contained true
          -p:PublishSingleFile=true
          -o $env:PUBLISH_DIR

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "installer\HASS.Agent.NET10.iss" "/DMyAppVersion=$env:APP_VERSION"

      - name: Package published app
        run: |
          New-Item -ItemType Directory -Force -Path $env:PACKAGE_DIR | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "$env:PACKAGE_DIR\HASS.Agent.NET10-win-x64-$env:APP_VERSION.zip" -Force

      - name: Upload published app
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HASS.Agent.NET10-win-x64
          path: artifacts/HASS.Agent.NET10/win-x64

      - name: Upload installer
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HASS.Agent.NET10-Setup
          path: artifacts/installer/*.exe

      # Use the annotated tag's own message as the release notes (softprops does not
      # do this on its own, and generate_release_notes only produced a PR list).
      - name: Prepare release notes from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $notes = git for-each-ref "refs/tags/$env:GITHUB_REF_NAME" --format='%(contents)'
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "$env:GITHUB_REF_NAME" }
          Set-Content -Path "$env:RUNNER_TEMP\RELEASE_NOTES.md" -Value $notes -Encoding utf8

      - name: Upload release assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/installer/*.exe
            artifacts/package/*.zip
