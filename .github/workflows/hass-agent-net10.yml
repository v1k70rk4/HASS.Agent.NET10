name: V1k70rk4 HASS.Agent .NET10

on:
  push:
    tags:
      - "v*"
    paths:
      - "src/HASS.Agent.NET10/**"
      - "tests/**"
      - "global.json"
      - "installer/**"
      - "NuGet.config"
      - ".github/workflows/hass-agent-net10.yml"
      - "README.md"
  pull_request:
    paths:
      - "src/HASS.Agent.NET10/**"
      - "tests/**"
      - "global.json"
      - "installer/**"
      - "NuGet.config"
      - ".github/workflows/hass-agent-net10.yml"
      - "README.md"
  # No "release: published" trigger, on purpose. The signed upload publishes the draft
  # release, and a run started by that event rebuilt the assets and uploaded them over the
  # signed ones a few minutes later: 10.7.3 and 10.8.0 were public unsigned that way.
  workflow_dispatch:

# Read-only by default; only the release job, which creates the draft release, may write.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: NuGet vulnerability audit
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Locked: the packages are the ones in packages.lock.json, by hash, or the restore fails.
      - name: Restore
        run: dotnet restore src/HASS.Agent.sln --locked-mode
      - name: Audit (fail on vulnerable packages)
        shell: bash
        run: |
          dotnet list src/HASS.Agent.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q 'has the following vulnerable' audit.txt; then
            echo "::error::Vulnerable NuGet packages found (see log above)"; exit 1
          fi
          echo "No vulnerable NuGet packages."

  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The installer signature tests need a real signed installer, too big for the
      # repository: the one of the latest published release is the reference.
      - name: Get the signed installer of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'signed'
          gh release download -R $env:GITHUB_REPOSITORY -p 'HASS.Agent.NET10-Setup-*.exe' -D $folder
          if ($LASTEXITCODE -ne 0) { throw "Could not download the latest release's installer." }
          $installer = Get-ChildItem $folder -Filter '*.exe' | Select-Object -First 1
          "Signed installer: $($installer.Name)"
          "HASS_AGENT_SIGNED_INSTALLER=$($installer.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run the tests
        run: dotnet test --project tests/HASS.Agent.NET10.Tests -c Release

  build:
    name: Build and publish
    # No release is built from code whose tests fail.
    needs: [audit, test]
    runs-on: windows-latest
    # Read-only, like the rest: this job runs for pull requests too, restores packages and
    # runs build tools. What it built for a tag is handed to the release job below.

    env:
      PROJECT: src/HASS.Agent.NET10/HASS.Agent.NET10.csproj
      CONFIGURATION: Release
      RUNTIME: win-x64
      PUBLISH_DIR: artifacts/HASS.Agent.NET10/win-x64
      INSTALLER_DIR: artifacts/installer
      PACKAGE_DIR: artifacts/package

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore $env:PROJECT --locked-mode

      - name: Build
        run: dotnet build $env:PROJECT -c $env:CONFIGURATION --no-restore

      - name: Read app version
        run: |
          [xml]$project = Get-Content $env:PROJECT
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Project version not found."
          }
          # The app installs an update only when the installer says it is of the release it was
          # downloaded for (InstallerIdentity), and the installer takes its version from the
          # project: under a tag that names another version, no PC would take the update.
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag $env:GITHUB_REF_NAME does not match the project version $version."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish self-contained win-x64
        run: >
          dotnet publish $env:PROJECT
          -c $env:CONFIGURATION
          -r $env:RUNTIME
          --self-contained true
          -p:PublishSingleFile=true
          -o $env:PUBLISH_DIR

      # The runner image brings Inno Setup 6. Only where it does not is it installed, in the
      # version named here; Chocolatey checks the download against the hash in its package.
      - name: Install Inno Setup if the runner has none
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup could not be installed." }
          }

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "installer\HASS.Agent.NET10.iss" "/DMyAppVersion=$env:APP_VERSION"

      - name: Package published app
        run: |
          New-Item -ItemType Directory -Force -Path $env:PACKAGE_DIR | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "$env:PACKAGE_DIR\HASS.Agent.NET10-win-x64-$env:APP_VERSION.zip" -Force

      - name: Upload published app
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HASS.Agent.NET10-win-x64
          path: artifacts/HASS.Agent.NET10/win-x64

      - name: Upload installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HASS.Agent.NET10-Setup
          path: artifacts/installer/*.exe

      # Use the annotated tag's own message as the release notes (softprops does not
      # do this on its own, and generate_release_notes only produced a PR list).
      # The notes and the two files go into one folder, for the release job to take.
      - name: Gather the release files
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          $notes = git for-each-ref "refs/tags/$env:GITHUB_REF_NAME" --format='%(contents)'
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "$env:GITHUB_REF_NAME" }
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Set-Content -Path artifacts/release/RELEASE_NOTES.md -Value $notes -Encoding utf8
          Copy-Item "$env:INSTALLER_DIR/HASS.Agent.NET10-Setup-$env:APP_VERSION.exe" artifacts/release/
          Copy-Item "$env:PACKAGE_DIR/HASS.Agent.NET10-win-x64-$env:APP_VERSION.zip" artifacts/release/

      - name: Hand the release files to the release job
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: artifacts/release
          if-no-files-found: error

  release:
    name: Draft release
    # Only the push of a tag makes a release, and only this job may write to the repository.
    # It builds nothing and restores nothing: it takes the files the build job made.
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write   # create the draft release and upload its assets

    steps:
      - name: Take the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      # A run for a tag whose release is already published (the run started again, the tag
      # pushed again) must not put these unsigned files over the signed ones. A draft is
      # still ours to fill.
      - name: Leave a published release alone
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $view = gh release view $env:GITHUB_REF_NAME -R $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>&1
          if ($LASTEXITCODE -eq 0) {
            if ("$view".Trim() -eq 'false') {
              Write-Host "::warning::Release $env:GITHUB_REF_NAME is already published; its files are left as they are."
              "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }
          elseif ("$view" -notmatch 'release not found') {
            throw "Could not tell whether release $env:GITHUB_REF_NAME is published: $view"
          }
          # "release not found" is the usual case; it must not end the step as a failure.
          $global:LASTEXITCODE = 0

      - name: Upload release assets
        if: steps.state.outputs.published != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          # A draft until the signed assets replace these: build-exe.ps1 -Tag -Upload
          # publishes it. Nothing unsigned is ever public, and Home Assistant does not
          # offer the release before it is signed.
          draft: true
          files: |
            release/*.exe
            release/*.zip
