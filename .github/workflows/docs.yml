# The website, https://hass-agent.com/: MkDocs builds it from docs/ and GitHub Pages serves
# the result. A push to main that touches the documentation or the changelog deploys it; a pull request only
# builds it, to show that it still does. The weekly run picks up changes of the integration's README, which the
# Integration pages show (website/hooks.py). After a deploy, the pages that changed go to IndexNow (Bing, Yandex,
# Seznam, Naver); a manual run can send every page.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      all_pages:
        description: Send every page to IndexNow, not only the changed ones
        type: boolean
        default: false

permissions: {}

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history: the sitemap dates each page by its last commit (website/hooks.py).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install MkDocs
        run: pip install --require-hashes --no-deps -r website/requirements.txt

      - name: Build
        run: mkdocs build --strict

      # Compared with the live site before the deploy replaces it.
      - name: Pages that changed
        id: changed
        if: github.event_name != 'pull_request'
        env:
          ALL_PAGES: ${{ inputs.all_pages }}
        run: |
          if [ "$ALL_PAGES" = "true" ]; then
            python website/indexnow.py site --all >> "$GITHUB_OUTPUT"
          else
            python website/indexnow.py site >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the site as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    name: IndexNow
    if: github.event_name != 'pull_request' && needs.build.outputs.changed != '' && needs.build.outputs.changed != '[]'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The key is public by design: search engines check it against docs/<key>.txt on the site.
      - name: Send the changed pages
        env:
          URLS: ${{ needs.build.outputs.changed }}
        run: |
          jq -n --argjson urls "$URLS" \
            '{host: "hass-agent.com", key: "d662a231f964e7e6e9fd4ab6fdc0abb0", urlList: $urls}' > body.json
          curl --silent --show-error --fail-with-body --max-time 60 \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @body.json https://api.indexnow.org/indexnow
          echo "Sent $(jq '.urlList | length' body.json) page(s)."
