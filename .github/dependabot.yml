# Dependabot: weekly update PRs for GitHub Actions, NuGet packages, the .NET SDK and the website's pip packages.
# Security updates are opened automatically once "Dependabot alerts" is enabled on the repo
# (Settings -> Code security). Grouped so each ecosystem lands as a single PR, not one per package.
version: 2
updates:
  # GitHub Actions referenced in .github/workflows/*
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # NuGet packages for the app project and its tests
  - package-ecosystem: "nuget"
    directories:
      - "/src/HASS.Agent.NET10"
      - "/tests/HASS.Agent.NET10.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      nuget:
        patterns: ["*"]
    # Majors of these are left out, each for its own reason:
    #  - a new major of NAudio changes the interfaces the audio code is written against (the Sendspin
    #    output, the audio devices), as 3 did; moving to one is a change of its own, with the player
    #    tried on a PC.
    #  - the System.* packages carry the number of a .NET version: they follow the .NET the app is built
    #    on (the SDK below), not the newest one.
    ignore:
      - dependency-name: "NAudio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Management"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.ServiceProcess.ServiceController"
        update-types: ["version-update:semver-major"]

  # The .NET SDK in global.json. The app is self-contained: the runtime of this SDK is built into
  # the release, and Windows Update does not patch it. A new SDK (a .NET security fix most months)
  # is the cue for a release built on it, its notes naming the CVEs it fixes. Majors are left out:
  # moving to a new .NET version is a change of its own.
  # Such a pull request fails the locked restore until packages.lock.json is written again on its
  # branch (dotnet restore src/HASS.Agent.sln --force-evaluate): one package comes with the SDK.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The website's build (MkDocs): website/requirements.txt, made with pip-compile --generate-hashes
  - package-ecosystem: "pip"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      website:
        patterns: ["*"]
