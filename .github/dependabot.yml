# Dependabot: weekly update PRs for GitHub Actions, NuGet packages and the website's pip packages.
# Security updates are opened automatically once "Dependabot alerts" is enabled on the repo
# (Settings -> Code security). Grouped so each ecosystem lands as a single PR, not one per package.
version: 2
updates:
  # GitHub Actions referenced in .github/workflows/*
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # NuGet packages for the app project and its tests
  - package-ecosystem: "nuget"
    directories:
      - "/src/HASS.Agent.NET10"
      - "/tests/HASS.Agent.NET10.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      nuget:
        patterns: ["*"]

  # The website's build (MkDocs): website/requirements.txt, made with pip-compile --generate-hashes
  - package-ecosystem: "pip"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      website:
        patterns: ["*"]
