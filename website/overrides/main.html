{% extends "base.html" %}

{% block extrahead %}
  {% if page %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HASS.Agent .NET10">
  <meta property="og:title" content="{% if page.is_homepage %}{{ config.site_name }}{% else %}{{ page.title }} · {{ config.site_name }}{% endif %}">
  <meta property="og:description" content="{{ page.meta.description | default(config.site_description) }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}images/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta name="twitter:card" content="summary_large_image">
  {% if page.is_homepage %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "HASS.Agent .NET10",
    "description": "{{ config.site_description }}",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Windows 10, Windows 11",
    "url": "{{ config.site_url }}",
    "downloadUrl": "https://github.com/v1k70rk4/HASS.Agent.NET10/releases/latest",
    "image": "{{ config.site_url }}images/social-preview.png",
    "screenshot": "{{ config.site_url }}images/ui-general.png",
    "license": "https://opensource.org/licenses/MIT",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "v1k70rk4", "url": "https://github.com/v1k70rk4" },
    "sameAs": [
      "https://github.com/v1k70rk4/HASS.Agent.NET10",
      "https://github.com/v1k70rk4/HASS.Agent.NET10-Integration"
    ]
  }
  </script>
  {% endif %}
  {% endif %}
{% endblock %}
